# g1d_collect_camera plus the third-person view (collect.py records cam_third when it renders): head with depth, both
# wrists and cam_third; no cam_head_right.
annotator:
  common:
    enabled: False
  cam_head:
    enabled: True
    rgb_capture:
      type: rgb
      device: cpu
    distance_to_image_plane_capture:
      type: distance_to_image_plane
      device: cpu
  cam_left_wrist:
    enabled: True
    rgb_capture:
      type: rgb
      device: cpu
  cam_right_wrist:
    enabled: True
    rgb_capture:
      type: rgb
      device: cpu
  cam_third:
    enabled: True
    rgb_capture:
      type: rgb
      device: cpu

cam_head:
  camera:
    type: Gemini_345Lg
    mesh: pinhole
    pos: [0.0, -0.41, 1.308]
    ori: [30.0, 0, 0]

# front right of the robot, looking at the robot and the table (world frame, wxyz), as g1d_camera
cam_third:
  camera:
    type: Gemini_345Lg
    mesh: pinhole
    pos: [0.65, -0.32, 1.2]
    ori: [0.4666, 0.3108, 0.459, 0.6892]
